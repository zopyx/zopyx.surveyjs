<h2>メンタルヘルス調査へようこそ</h2>
<p>この短い匿名の調査は、現在の心身の状態を振り返るためのものです。診断を目的としたものではありません。危機的状況にある場合は、専門家や地域の緊急連絡先に相談してください。</p>
<p>質問は気分、ストレス、睡眠、サポート、集中に焦点を当てています。正直に回答することで振り返りに役立ちます。</p>
<p><em>注意:</em> これはデモ用の調査です。メンタルヘルスに関する不安がある場合は専門家の助言を受けてください。</p>
