version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Plone 5.2 constraint chain is legacy; dependabot cannot resolve
      # the remote constraint URL it references.
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pip"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/playwright-tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
