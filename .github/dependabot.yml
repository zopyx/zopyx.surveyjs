version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # zc.buildout, setuptools and pip versions are dictated by the
      # Plone 6.1-latest buildout chain (dist.plone.org versions.cfg);
      # bumping them independently breaks buildout (VersionConflict).
      - dependency-name: "zc.buildout"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pip"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/playwright-tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
