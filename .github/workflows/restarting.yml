name: Regular restart

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-container:
    runs-on: ubuntu-latest
    steps:
      - name: Restart remote container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: py-berater.de
          username: privacyforms
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/privacyforms/demo:latest
            docker stop -t 30 pfs-demo || true
            docker rm pfs-demo || true
            docker run -d \
              --name pfs-demo \
              --restart unless-stopped \
              -p 10000:8082 \
              ghcr.io/${{ github.repository_owner }}/privacyforms/demo:latest
            docker ps --filter "name=^/pfs-demo$" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            docker logs --tail 50 pfs-demo
