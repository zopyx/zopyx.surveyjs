name: Playwright Screenshots

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'playwright-tests/**'
      - '.github/workflows/screenshots.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'playwright-tests/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      category:
        description: 'Screenshot category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - survey
          - psf
          - cp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLONE_URL: http://localhost:8082/demo
  PLONE_ADMIN_USER: admin2
  PLONE_ADMIN_PASS: 2admin
  SCREENSHOT_DIR: ./playwright-tests/screenshots/output

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Plone Buildout
        uses: ./.github/actions/setup-plone-buildout

      # Set up Node.js for Playwright
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'playwright-tests/package-lock.json'

      - name: Install Playwright dependencies
        working-directory: ./playwright-tests
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright-tests/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: ./playwright-tests
        run: npx playwright install chromium

      # Start Plone and run screenshots
      - name: Initialize and start Plone
        run: |
          echo "Initializing demo Plone site..."
          ./bin/instance run scripts/init_plone.py
          echo "Starting Plone instance in background..."
          ./bin/instance start
          echo "Waiting for Plone to be ready..."
          for i in {1..60}; do
            if curl -s --max-time 5 http://localhost:8082/demo/en > /dev/null 2>&1; then
              echo "Plone is ready!"
              exit 0
            fi
            echo -n "."
            sleep 1
          done
          echo "Plone failed to start within 60s"
          exit 1

      - name: Run Playwright screenshot tests
        working-directory: ./playwright-tests
        run: |
          CATEGORY="${{ github.event.inputs.category || 'all' }}"
          echo "Running screenshot category: $CATEGORY"
          
          if [ "$CATEGORY" = "all" ]; then
            npm run screenshots
          else
            npm run screenshots:$CATEGORY
          fi

      # Upload artifacts on failure for debugging
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            playwright-tests/screenshots/output/test-results/
            playwright-tests/screenshots/output/report/
          retention-days: 7

      # Upload screenshots as artifacts on success
      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            playwright-tests/screenshots/output/*.png
          retention-days: 30

      # Stop Plone
      - name: Stop Plone
        if: always()
        run: ./bin/instance stop || true
