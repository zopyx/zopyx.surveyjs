name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      # `make docs` builds with warnings-as-errors (-W) in an ephemeral uv
      # environment; the build fails on any Sphinx warning or broken link.
      - name: Build documentation
        run: make docs
