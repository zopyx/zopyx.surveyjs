name: Build source distribution

on:
  push:
    branches: [master]
    tags: ["*"]
    paths-ignore:
      - 'docs/**'
      - 'playwright-tests/**'
      - 'app/**'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/restarting.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'playwright-tests/**'
      - 'app/**'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/restarting.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create GitHub releases for tags.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install Python with uv
        run: uv python install 3.13

      - name: Create venv
        run: uv venv --python 3.13

      - name: Install sdist build tooling
        run: uv pip install --python .venv/bin/python setuptools

      - name: Build source distribution
        run: make sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pre-releases (1.0b1, 1.0rc1, …, including .dev/.post artefacts)
          # must be flagged as such, otherwise the tag would be offered as
          # the project's latest release.
          version="$(basename dist/*.tar.gz | sed -E 's/^.*surveyjs[._-]([^-]+)\.tar\.gz$/\1/')"
          case "$version" in
            *[ab][0-9]*|*rc[0-9]*|*dev[0-9]*|*post[0-9]*)
              gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
                --generate-notes --prerelease
              ;;
            *)
              gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
                --generate-notes
              ;;
          esac