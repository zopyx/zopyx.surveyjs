# Build and publish the Docker image to GHCR
name: Demo Docker image -> Prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: privacyforms/demo

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # Required to publish the image to GHCR.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: false

      - name: Decrypt environment file
        shell: bash
        run: |
          uv run scripts/filecrypt.py --decrypt .env "$ENV_PASSWORD"
          ls -la .env
        env:
          ENV_PASSWORD: ${{ secrets.ENV_PASSWORD }}

      - name: Add SurveyJS license key to checkout
        # Key source: GitHub secret SURVEYJS_KEY (deliberate, see plan 2026-08).
        # 1Password is not usable in CI: the key lives in the personal
        # "Private" vault and 1Password service accounts cannot be granted
        # access to personal vaults. The op-CLI fallback in init_plone.py is
        # for local development only. Note: surveyjs.licensekey must NOT be
        # added to .dockerignore - the Dockerfile COPYs it into the image for
        # init_plone.py (removed again in the same RUN).
        shell: bash
        run: |
          printf '%s' "$SURVEYJS_KEY" > surveyjs.licensekey
          chmod 600 surveyjs.licensekey
        env:
          SURVEYJS_KEY: ${{ secrets.SURVEYJS_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/master') }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # AI settings for init_plone.py (runs at build time). Injected as
          # BuildKit secrets into the RUN --mount=type=secret (env=...), so
          # they are visible only during that build step and never baked
          # into image layers or the image config.
          secrets: |
            "ai_model=${{ secrets.AI_MODEL }}"
            "ai_api_key=${{ secrets.AI_API_KEY }}"

      - name: Deploy to remote server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: public.zopyx.com
          username: privacyforms
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ssh-action does NOT forward step `env:` to the remote shell;
          # variables must be listed explicitly in `envs:` (comma-separated)
          # or they arrive empty on the server.
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_OWNER,IMAGE_NAME
          script: |
            echo "Restarting on host: zopyx.com"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "ghcr.io/$IMAGE_OWNER/$IMAGE_NAME:latest"
            docker stop -t 30 pfs-demo || true
            docker kill pfs-demo || true
            docker rm pfs-demo || true
            docker run -d \
              --name pfs-demo \
              --restart unless-stopped \
              -p 10000:8082 \
              "ghcr.io/$IMAGE_OWNER/$IMAGE_NAME:latest"
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
