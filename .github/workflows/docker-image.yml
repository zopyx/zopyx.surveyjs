# Build and publish the Docker image to GHCR
name: Build PFS demo docker image and push to production

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: privacyforms/demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SurveyJS license key to checkout
        shell: bash
        run: |
          echo "SURVEYJS_KEY=${{ secrets.SURVEYJS_KEY }}" >> "$GITHUB_ENV"
          printf '%s' "${{ secrets.SURVEYJS_KEY }}" > surveyjs.licensekey
          chmod 600 surveyjs.licensekey

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/master') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to remote server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: py-berater.de
          username: privacyforms
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            docker stop -t 30 pfs-demo || true
            docker kill pfs-demo || true
            docker rm pfs-demo || true
            docker run -d \
              --name pfs-demo \
              -p 10000:8082 \
              ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
