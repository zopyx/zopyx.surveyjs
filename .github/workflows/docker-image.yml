# Build and publish the Docker image to GHCR
name: Demo Docker image -> Prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: privacyforms/demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Decrypt environment file
        shell: bash
        run: |
          uv run scripts/filecrypt.py --decrypt .env "${{ secrets.ENV_PASSWORD }}"
          ls -la .env

      - name: Add SurveyJS license key to checkout
        # Key source: GitHub secret SURVEYJS_KEY (deliberate, see plan 2026-08).
        # 1Password is not usable in CI: the key lives in the personal
        # "Private" vault and 1Password service accounts cannot be granted
        # access to personal vaults. The op-CLI fallback in init_plone.py is
        # for local development only. Note: surveyjs.licensekey must NOT be
        # added to .dockerignore - the Dockerfile COPYs it into the image for
        # init_plone.py (removed again in the same RUN).
        shell: bash
        run: |
          printf '%s' "${{ secrets.SURVEYJS_KEY }}" > surveyjs.licensekey
          chmod 600 surveyjs.licensekey

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/master') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to remote server
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: public.zopyx.com 
          username: privacyforms
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Restarting on host: zopyx.com"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            docker stop -t 30 pfs-demo || true
            docker kill pfs-demo || true
            docker rm pfs-demo || true
            docker run -d \
              --name pfs-demo \
              --restart unless-stopped \
              -p 10000:8082 \
              ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
