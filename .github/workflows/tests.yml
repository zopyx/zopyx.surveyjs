name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'playwright-tests/**'
      - 'app/**'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/restarting.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'playwright-tests/**'
      - 'app/**'
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/docker-image.yml'
      - '.github/workflows/restarting.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Plone Buildout
        uses: ./.github/actions/setup-plone-buildout

      - name: Cache database container images
        run: docker pull postgres:16 && docker pull mysql:8

      - name: Run unit tests
        run: make test
        env:
          RUN_DB_CONTAINER_TESTS: "1"

      - name: Verify pinned Deno build metadata
        run: bin/zopepy -m pytest src/zopyx/surveyjs/data_validation/tests/test_deno_build.py src/zopyx/surveyjs/data_validation/tests/test_validate_data.py -v

  package-matrix:
    name: Package on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # WeasyPrint (converters/pdf.py) needs Pango/Cairo at import time.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libgdk-pixbuf-2.0-0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      # Builds the distribution from setup.py: this is the metadata and
      # packaging gate for every advertised Python version.
      - name: Build and install the distribution
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python --no-deps .

      # Only the Plone-free runtime dependencies: the tests below exercise
      # the imported package, not the buildout environment.
      - name: Install the test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            pytest \
            zope.i18nmessageid \
            orjson \
            markdown2 \
            openpyxl \
            python-docx \
            weasyprint \
            cssselect \
            cssselect2

      - name: Run the Plone-free test subset
        run: |
          .venv/bin/python -m pytest \
            src/zopyx/surveyjs/converters/tests \
            src/zopyx/surveyjs/schema/tests \
            src/zopyx/surveyjs/data_validation/tests \
            -q

  validator-binary:
    name: Verify validator binary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build the pinned validator binary
        run: python3 src/zopyx/surveyjs/data_validation/deno_build.py --targets linux

      - name: Verify provenance digest of the built binary
        working-directory: src/zopyx/surveyjs/data_validation
        run: |
          set -euo pipefail
          test "$(sha256sum validate-linux | cut -d' ' -f1)" = "$(cat validate-linux.sha256)"

      - name: Exercise the real binary against fixtures
        working-directory: src/zopyx/surveyjs/data_validation
        run: |
          set -euo pipefail
          ./validate-linux --schema-json survey.json --form-json data-valid.json --result-json /tmp/out-valid.json
          python3 -c 'import json; assert json.load(open("/tmp/out-valid.json"))["valid"] is True'
          set +e
          ./validate-linux --schema-json survey.json --form-json data-invalid.json --result-json /tmp/out-invalid.json
          rc=$?
          set -e
          test "$rc" -eq 1
          python3 - <<'EOF'
          import json
          data = json.load(open("/tmp/out-invalid.json"))
          assert data["valid"] is False
          assert data["errors"], "no errors reported"
          assert all(msg for err in data["errors"] for msg in err["messages"]), "empty validator message"
          codes = {code for err in data["errors"] for code in err["codes"]}
          assert "required" in codes, f"expected required code, got {codes}"
          EOF

      - name: Exercise the Python wrapper end-to-end
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "src/zopyx/surveyjs/data_validation")
          from validate_data import validate_data
          rc = validate_data(
              schema_json="src/zopyx/surveyjs/data_validation/survey.json",
              form_json="src/zopyx/surveyjs/data_validation/data-invalid.json",
              result_json="/tmp/wrapper-out.json",
          )
          assert rc == 1, rc
          assert json.load(open("/tmp/wrapper-out.json"))["valid"] is False
          rc = validate_data(
              schema_json="src/zopyx/surveyjs/data_validation/survey.json",
              form_json="src/zopyx/surveyjs/data_validation/data-valid.json",
              result_json="/tmp/wrapper-out2.json",
          )
          assert rc == 0, rc
          print("wrapper e2e ok")
          EOF
