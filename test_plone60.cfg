# Pin the buildout chain to Plone 6.2.2.1 instead of the moving 6.2-latest
# KGS; requirements.txt mirrors this release. The pinned versions.cfg comes
# after the buildout.plonetest extends so its pins win over 6.2-latest.
[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-6.2.x.cfg
    https://dist.plone.org/release/6.2.2.1/versions.cfg
    base.cfg

find-links =
    https://dist.plone.org/release/6.2.2.1/
