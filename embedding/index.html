<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SurveyJS Embed Demo</title>
    <style>
      :root {
        --frame-w: 80vw;
        --frame-h: 80vh;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f5f5f0;
        font-family: "Georgia", "Times New Roman", serif;
      }
      .frame {
        width: var(--frame-w);
        height: var(--frame-h);
        border: 1px solid #1e1e1e;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        background: white;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <iframe
        src="http://localhost:8082/demo/de/demos/event-rsvp-de/viewer-embed"
        title="Event RSVP (DE)"
        loading="lazy"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
  </body>
</html>
