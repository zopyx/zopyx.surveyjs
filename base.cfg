[buildout]
show-picked-versions = true
extensions =
    mr.developer

allow-unknown-extras=true

parts =
    instance
    test
# we use tox for testing and linting, by default
#    code-analysis
    coverage
    test-coverage
    createcoverage
    releaser
    i18ndude
    omelette
    robot
    plone-helper-scripts
    vscode

develop = .

sources = sources

auto-checkout = 
    privacyforms.theme
    privacyforms.ai
    privacyforms.pdf


[instance]
recipe = plone.recipe.zope2instance
user = admin2:2admin
http-address = 8082
environment-vars =
    zope_i18n_compile_mo_files true
    PYTHONWARNINGS ignore
eggs =
    Plone
    Pillow
    zopyx.surveyjs [test]
    privacyforms.theme
    privacyforms.ai
    privacyforms.pdf

[vscode]
recipe = collective.recipe.vscode
eggs = ${instance:eggs}
autocomplete-use-omelette = True

# [code-analysis]
# recipe = plone.recipe.codeanalysis
# directory = ${buildout:directory}/src/zopyx
# return-status-codes = False


[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}


[test]
recipe = zc.recipe.testrunner
eggs = ${instance:eggs}
initialization =
    os.environ['TZ'] = 'UTC'
defaults = ['-s', 'zopyx.surveyjs', '--auto-color', '--auto-progress']


[coverage]
recipe = zc.recipe.egg
eggs = coverage


[test-coverage]
recipe = collective.recipe.template
input = inline:
    #!/bin/bash
    export TZ=UTC
    ${buildout:directory}/bin/coverage run bin/test $*
    ${buildout:directory}/bin/coverage html
    ${buildout:directory}/bin/coverage report -m --fail-under=90
    # Fail (exit status 1) if coverage returns exit status 2 (this happens
    # when test coverage is below 100%.
output = ${buildout:directory}/bin/test-coverage
mode = 755


[createcoverage]
recipe = zc.recipe.egg
eggs = createcoverage


[robot]
recipe = zc.recipe.egg
eggs =
    ${test:eggs}
    plone.app.robotframework[debug,reload]


[releaser]
recipe = zc.recipe.egg
eggs = zest.releaser


[i18ndude]
recipe = zc.recipe.egg
eggs = i18ndude

[plone-helper-scripts]
recipe = zc.recipe.egg
eggs =
   Products.CMFPlone
   ${instance:eggs}
interpreter = zopepy
scripts =
   zopepy
   plone-compile-resources

[versions]
# Don't use a released version of zopyx.surveyjs
zopyx.surveyjs =
Pillow = 12.0.0
typing-extensions=4.14.1
click= 8.3.1
zodbpickle = 4.3
RestrictedPython = 8.1
robotframework-seleniumlibrary = 6.8.0
[sources]
#privacyforms.theme = git git@github.com:zopyx/privacyforms.theme.git
privacyforms.theme = git https://github.com/zopyx/privacyforms.theme.git
privacyforms.pdf = git https://github.com/zopyx/privacyforms.pdf.git
privacyforms.ai = git https://github.com/zopyx/privacyforms.ai.git
